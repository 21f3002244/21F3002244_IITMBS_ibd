name: Iris MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc-gs

      - name: Authenticate with Google Cloud using WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/27299784781/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-dvc-reader@iitm-mlops-oppe-1.iam.gserviceaccount.com

      - name: Pull DVC datasets
        run: dvc pull

      - name: Run inference tests
        run: PYTHONPATH=. python -m pytest -q

      - name: Evaluate model
        run: PYTHONPATH=. python -m src.evaluate

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: iris-evaluation-report
          path: outputs/ci_evaluation.json
